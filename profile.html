<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoNet // Profile View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    
    /* Org Chart Styling */
    .org-canvas { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; }
    .tree-line-v { width: 2px; background: #64748b; }
    
    /* Document Modal Overlay */
    #doc-modal { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 2rem; }
    #doc-modal.active { display: flex; }
    .modal-content { background: white; width: 90%; max-width: 1000px; height: 85vh; border-radius: 24px; position: relative; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; border: 4px solid #cbd5e1; }
    .modal-header { padding: 16px 24px; background: #f1f5f9; border-bottom: 2px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { flex: 1; position: relative; background: #e2e8f0; }
    
    /* Document Close Button */
    .close-btn { color: #ef4444; background: white; border: 2px solid #ef4444; border-radius: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(239,68,68,0.2); }
    .close-btn:hover { background: #ef4444; color: white; transform: scale(1.05); }

    /* Custom Scrollbar for Summary */
    .custom-scroll::-webkit-scrollbar { width: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="flex flex-col">

  <!-- Main Three-Column Layout -->
  <div class="flex h-screen w-full max-w-[1600px] mx-auto p-6 gap-8">
    
    <!-- LEFT COLUMN: Identity, Org Chart, Misconduct -->
    <div class="w-[350px] shrink-0 flex flex-col h-full overflow-y-auto custom-scroll pr-4 pb-12">
      <!-- Portrait & ID -->
      <div class="flex flex-col items-center text-center mb-6">
        <div class="w-[200px] h-[200px] bg-slate-200 border-4 border-slate-300 rounded-xl overflow-hidden mb-4 shadow-sm">
          <img id="p-portrait" src="" class="w-full h-full object-cover hidden">
          <i id="p-portrait-icon" class="fa-solid fa-user text-6xl text-slate-400 mt-12"></i>
        </div>
        <h1 id="p-name" class="text-2xl font-extrabold text-slate-900 leading-tight mb-1">Loading...</h1>
        <h2 id="p-org" class="text-[15px] font-bold text-slate-700 leading-snug"></h2>
        <h3 id="p-rank" class="text-[14px] font-bold text-red-600 leading-snug"></h3>
      </div>

      <!-- Org Chart Box -->
      <div class="bg-white border-[3px] border-black rounded-2xl p-4 mb-6 shadow-sm min-h-[200px] flex items-center justify-center relative overflow-hidden group">
        <div id="p-orgchart" class="org-canvas w-full"></div>
      </div>

      <!-- Misconduct Text List -->
      <div id="p-misconduct" class="text-[14px] font-bold text-slate-800 space-y-1.5 px-2">
        <!-- Populated via JS -->
      </div>
    </div>

    <!-- Divider Line -->
    <div class="w-1 bg-slate-400 rounded-full my-4 opacity-50 shrink-0"></div>

    <!-- MIDDLE COLUMN: Summary -->
    <div class="flex-1 flex flex-col h-full px-4 min-w-0">
      <h2 class="text-3xl font-extrabold text-center text-slate-900 mb-8 mt-2 tracking-tight">Summary</h2>
      <div id="p-summary" class="flex-1 overflow-y-auto custom-scroll text-[16px] text-slate-800 leading-relaxed font-medium pb-12">
        <!-- Content injected here -->
      </div>
    </div>

    <!-- Divider Line -->
    <div class="w-1 bg-slate-400 rounded-full my-4 opacity-50 shrink-0"></div>

    <!-- RIGHT COLUMN: Related Documents -->
    <div class="w-[300px] shrink-0 flex flex-col h-full pl-4">
      <h2 class="text-3xl font-extrabold text-center text-slate-900 mb-8 mt-2 tracking-tight">Sources</h2>
      <div id="p-documents" class="flex flex-col gap-5 overflow-y-auto custom-scroll pb-12">
        <!-- Document links injected here -->
      </div>
    </div>

  </div>

  <!-- Document Modal Overlay -->
  <div id="doc-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" class="text-xl font-bold text-slate-800 truncate pr-4">Document Viewer</h3>
        <button onclick="closeDocument()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <iframe id="modal-iframe" src="" class="absolute inset-0 w-full h-full border-none"></iframe>
      </div>
    </div>
  </div>

  <script>
    let ALL_PROFILES = [];

    // 1. Fetch Data on Load
    async function loadProfileData() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('id');
      const apiEndpoint = urlParams.get('api') || 'https://projectostracon.com/wp-json/geonet/v1/profiles';

      if(!targetId) {
          document.getElementById('p-name').textContent = "Error: No Profile ID provided.";
          return;
      }

      try {
        const res = await fetch(apiEndpoint, { cache: 'no-store' });
        if (res.ok) {
          ALL_PROFILES = await res.json();
          const profile = ALL_PROFILES.find(p => p.id === targetId);
          if (profile) buildPage(profile);
          else document.getElementById('p-name').textContent = "Profile not found.";
        }
      } catch (e) {
        console.error("API Fetch Error:", e);
        document.getElementById('p-name').textContent = "Network Error.";
      }
    }

    // 2. Build the Page Layout
    function buildPage(profile) {
      // Left Column: Identity
      document.getElementById('p-name').textContent = profile.name;
      document.getElementById('p-org').textContent = profile.organization || '';
      document.getElementById('p-rank').textContent = profile.rank || '';
      
      if (profile.portrait) {
        const img = document.getElementById('p-portrait');
        img.src = profile.portrait;
        img.classList.remove('hidden');
        document.getElementById('p-portrait-icon').classList.add('hidden');
      }

      // Left Column: Misconduct Text Format
      let misconductHtml = '';
      if (profile.misconductData) {
          profile.misconductData.forEach(item => {
              misconductHtml += `<div>${item.name}: <span class="font-normal text-slate-600">${item.label}</span></div>`;
          });
      }
      document.getElementById('p-misconduct').innerHTML = misconductHtml;

      // Middle Column: Summary
      document.getElementById('p-summary').innerHTML = profile.summary || '<p class="text-slate-400 italic text-center mt-10">No summary available.</p>';

      // Right Column: Documents
      let docsHtml = '';
      if (profile.documents && profile.documents.length > 0) {
          profile.documents.forEach((doc, index) => {
              docsHtml += `
                <button onclick="openDocument('${doc.url}', '${doc.title.replace(/'/g, "\\'")}')" class="text-left text-[15px] font-semibold text-blue-600 hover:text-blue-800 hover:underline transition truncate w-full">
                  ${doc.title}
                </button>
              `;
          });
      } else {
          docsHtml = '<p class="text-slate-400 italic text-center mt-4 text-sm">No related documents.</p>';
      }
      document.getElementById('p-documents').innerHTML = docsHtml;

      // Left Column: Build Org Chart
      buildOrgChart(profile);
    }

    // 3. Reusable Org Chart Node Builder
    function createOrgNode(p, isActive = false) {
      if(!p) return '';
      const activeClass = isActive ? 'border-[#9f1239] bg-[#f87171] border-[3px]' : 'border-[#94a3b8] bg-[#cbd5e1] border-[2px]';
      const imgHtml = p.portrait ? `<img src="${p.portrait}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-white text-xs"></i>`;
      
      // On click, reload this page with the new user's ID
      return `
        <a href="?id=${p.id}&api=${new URLSearchParams(window.location.search).get('api')}" class="flex flex-col items-center group no-underline">
          <div class="w-[35px] h-[35px] rounded flex items-center justify-center overflow-hidden mb-1 shadow-sm ${activeClass}">
            ${imgHtml}
          </div>
        </a>`;
    }

    // 4. Draw Org Chart
    function buildOrgChart(profile) {
      let orgHtml = `<div class="flex flex-col items-center">`;
      
      const supIds = profile.supervisorIds || [];
      if (supIds.length > 0) {
        orgHtml += `<div class="flex gap-4 justify-center">`;
        supIds.forEach(id => { const s = ALL_PROFILES.find(x => x.id === id); if(s) orgHtml += createOrgNode(s); });
        orgHtml += `</div><div class="tree-line-v h-4"></div>`;
      }
      
      orgHtml += createOrgNode(profile, true);
      
      const subIds = profile.subordinateIds || [];
      if (subIds.length > 0) {
        orgHtml += `<div class="tree-line-v h-4"></div>`;
        orgHtml += `<div class="relative w-full flex justify-center gap-4 pt-3 border-t-2 border-slate-500 mt-[-2px]">`;
        subIds.forEach(id => { 
          const s = ALL_PROFILES.find(x => x.id === id); 
          if(s) orgHtml += `<div class="relative -mt-3 flex flex-col items-center"><div class="tree-line-v h-3"></div>${createOrgNode(s)}</div>`; 
        });
        orgHtml += `</div>`;
      }
      
      orgHtml += `</div>`;
      document.getElementById('p-orgchart').innerHTML = orgHtml;
    }

    // 5. Document Modal Logic
    function openDocument(url, title) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-iframe').src = url;
      document.getElementById('doc-modal').classList.add('active');
    }

    function closeDocument() {
      document.getElementById('doc-modal').classList.remove('active');
      document.getElementById('modal-iframe').src = ''; // Clear iframe to stop audio/video
    }

    // Initialize
    loadProfileData();
  </script>
</body>
</html>
