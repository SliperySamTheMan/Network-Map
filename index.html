<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoNet // Interactive US Organizational Network Atlas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
    #map-container { display: flex; height: 100vh; width: 100%; position: relative; } 
    #map { flex: 1; height: 100%; z-index: 1; }
    .leaflet-control-attribution, .leaflet-attribution-flag { display: none !important; }
    
    #left-sidebar { width: 440px; background: white; border-right: 4px solid #475569; z-index: 20; display: none; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
    #left-sidebar.active { display: flex; }

    #misconduct-container { flex: 0 1 30%; overflow-y: auto; border-b: 4px solid #000; padding-bottom: 8px; }
    .metric-bar-container { position: relative; padding-bottom: 12px; margin-top: 14px; }
    .metric-bar { width: 100%; height: 14px; border-radius: 7px; border: 2px solid #000; background: linear-gradient(to right, #22c55e 0%, #84cc16 25%, #eab308 50%, #f97316 75%, #ef4444 100%); position: relative; margin-top: 4px; }
    .metric-marker { position: absolute; top: 12px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid #000; transform: translateX(-50%); transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

    #org-scroll-container { flex: 1; overflow: hidden; background: white; position: relative; cursor: grab; }
    #org-scroll-container:active { cursor: grabbing; }
    .org-canvas { min-width: 100%; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px; transform-origin: center center; }
    
    .tree-line-v { width: 3px; background: #64748b; }
    .tree-line-h { height: 3px; background: #64748b; width: 100%; position: absolute; top: 0; }

    .geonet-cluster-marker { background: #ef4444; color: #ffffff; border: 3px solid #ffffff; border-radius: 9999px; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.45); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; transition: transform 0.15s ease; cursor: pointer; }
    .geonet-cluster-marker:hover { transform: scale(1.1); }
    .geonet-card-marker { background: #ffffff; border: 2px solid #0f172a; border-radius: 9999px; padding: 3px 10px 3px 3px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18); white-space: nowrap; transition: all 0.15s ease; cursor: pointer;}
    .geonet-card-marker:hover { border-color: #ef4444; transform: translateY(-2px); }
  </style>
</head>
<body class="flex flex-col h-screen select-none">
  <div id="map-container">
    
    <div id="left-sidebar">
      <div class="p-5 relative shrink-0">
        <button onclick="closeSidebar()" class="absolute top-2 right-3 text-slate-400 hover:text-slate-900 text-xl"><i class="fa-solid fa-xmark"></i></button>
        
        <div class="flex justify-between items-start border-b-[3px] border-black pb-4 mb-2 mt-2">
          <div class="flex items-center gap-3">
            <div id="sb-portrait-container" class="w-[60px] h-[60px] rounded-lg bg-slate-200 border-2 border-slate-400 overflow-hidden shrink-0 hidden">
              <img id="sb-portrait" src="" class="w-full h-full object-cover">
            </div>
            <div class="overflow-hidden">
              <h2 id="sb-name" class="text-2xl font-bold text-slate-900 truncate">Name</h2>
              <div id="sb-rank" class="text-xs font-bold text-red-600 truncate mt-0.5">Rank</div>
            </div>
          </div>
          <a id="sb-seemore" href="#" target="_top" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-1.5 rounded-lg border-2 border-black shadow-sm text-sm transition-colors whitespace-nowrap mt-1">
            See More
          </a>
        </div>
        
        <div class="text-[13px] text-slate-800 space-y-1 mb-2 border-b-[3px] border-black pb-2 font-semibold">
          <div>Org: <span id="sb-org" class="font-normal text-slate-600"></span></div>
        </div>
      </div>

      <div id="misconduct-container" class="px-5">
        <!-- Populated via JS -->
      </div>

      <div id="org-scroll-container">
        <div id="org-canvas-content" class="org-canvas">
          <!-- Populated via JS -->
        </div>
      </div>
    </div>

    <div id="map"></div>
    <button onclick="syncProfiles()" class="absolute top-4 left-4 z-10 w-10 h-10 rounded-full bg-slate-900 text-emerald-400 flex items-center justify-center shadow-lg hover:bg-slate-800 transition" title="Refresh Live Data">
      <i class="fa-solid fa-rotate text-sm"></i>
    </button>
    <div class="absolute top-4 right-4 z-10 w-64 pointer-events-auto">
      <div class="bg-white/95 backdrop-blur-md rounded-2xl p-3 shadow-lg border border-slate-200">
        <h3 class="text-xs font-extrabold text-slate-900 mb-2">Map Layers & Filters</h3>
        <div class="grid grid-cols-3 bg-slate-100 p-1 rounded-xl border border-slate-200 text-[10px] font-semibold mb-3">
          <button onclick="switchBaseMap('googleLight')" id="layer-googleLight" class="py-1 rounded-lg bg-white text-slate-900 shadow-sm transition">Light</button>
          <button onclick="switchBaseMap('googleTerrain')" id="layer-googleTerrain" class="py-1 rounded-lg text-slate-600 transition">Terrain</button>
          <button onclick="switchBaseMap('cleanLight')" id="layer-cleanLight" class="py-1 rounded-lg text-slate-600 transition">Minimal</button>
        </div>
        <label class="flex items-center justify-between text-[11px] text-slate-600 font-medium mb-3 cursor-pointer">
          <span>Cluster zoom (Number Bubbles)</span>
          <input type="checkbox" id="toggle-clustering" checked onchange="renderNetwork()" class="w-3.5 h-3.5 accent-red-600 rounded cursor-pointer" />
        </label>
        <div class="flex items-center justify-between gap-2">
          <label class="text-[11px] text-slate-600 font-medium">Organization:</label>
          <select id="select-org-filter" onchange="renderNetwork()" class="text-[11px] font-semibold bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 text-slate-800 outline-none max-w-[120px] truncate"></select>
        </div>
      </div>
    </div>
  </div>

  <script>
    const map = L.map('map', { 
      center: [39.8283, -98.5795], 
      zoom: 5, 
      minZoom: 3, 
      zoomControl: false, 
      attributionControl: false,
      maxBounds: [[-90, -180], [90, 180]],
      maxBoundsViscosity: 1.0
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const tileLayers = {
      googleLight: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      googleTerrain: L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      cleanLight: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 })
    };
    let currentLayer = tileLayers.googleLight.addTo(map);
    
    const linesLayerGroup = L.layerGroup().addTo(map);
    const nodesLayerGroup = L.layerGroup().addTo(map);
    let PROFILES = [];

    const orgContainer = document.getElementById('org-scroll-container');
    const orgCanvas = document.getElementById('org-canvas-content');
    let isDragging = false;
    let startX, startY, initialTranslateX = 0, initialTranslateY = 0;
    let currentTranslateX = 0, currentTranslateY = 0;

    orgContainer.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.pageX;
        startY = e.pageY;
    });

    window.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            initialTranslateX = currentTranslateX;
            initialTranslateY = currentTranslateY;
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        
        const dx = e.pageX - startX;
        const dy = e.pageY - startY;
        
        currentTranslateX = initialTranslateX + dx;
        currentTranslateY = initialTranslateY + dy;
        
        orgCanvas.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
    });

    function resetOrgChartPosition() {
        initialTranslateX = 0;
        initialTranslateY = 0;
        currentTranslateX = 0;
        currentTranslateY = 0;
        orgCanvas.style.transform = `translate(0px, 0px)`;
    }

    function switchBaseMap(layerKey) {
      map.removeLayer(currentLayer);
      currentLayer = tileLayers[layerKey].addTo(map);
      ['googleLight', 'googleTerrain', 'cleanLight'].forEach(key => {
        document.getElementById(`layer-${key}`).className = key === layerKey ? 'py-1 rounded-lg bg-white text-slate-900 shadow-sm transition' : 'py-1 rounded-lg text-slate-600 hover:text-slate-900 transition';
      });
    }

    map.on('zoomend', () => renderNetwork());

    function renderNetwork() {
      nodesLayerGroup.clearLayers();
      linesLayerGroup.clearLayers();
      
      const selectedOrg = document.getElementById('select-org-filter').value;
      const activeProfiles = selectedOrg === 'ALL' ? PROFILES : PROFILES.filter(p => (p.organization || 'Unassigned') === selectedOrg);
      if (activeProfiles.length === 0) return;

      activeProfiles.forEach(p => {
        const higherConnections = p.supervisorIds || [];
        higherConnections.forEach(targetId => {
          const target = activeProfiles.find(t => t.id === targetId);
          if (target) {
            L.polyline([[p.lat, p.lng], [target.lat, target.lng]], {
              color: '#ef4444', weight: 2.5, opacity: 0.6, dashArray: '6, 6'
            }).addTo(linesLayerGroup);
          }
        });
        
        const lowerConnections = p.subordinateIds || [];
        lowerConnections.forEach(targetId => {
          const target = activeProfiles.find(t => t.id === targetId);
          if (target) {
            L.polyline([[p.lat, p.lng], [target.lat, target.lng]], {
              color: '#ef4444', weight: 2.5, opacity: 0.6, dashArray: '6, 6'
            }).addTo(linesLayerGroup);
          }
        });
      });

      const zoom = map.getZoom();
      const clusterEnabled = document.getElementById('toggle-clustering').checked;

      if (clusterEnabled && zoom < 10) {
        const gridSize = zoom <= 6 ? 4.5 : 1.2;
        const buckets = {};
        activeProfiles.forEach(p => {
          const key = `${Math.round(p.lat / gridSize)}_${Math.round(p.lng / gridSize)}`;
          if (!buckets[key]) buckets[key] = [];
          buckets[key].push(p);
        });

        Object.values(buckets).forEach(group => {
          const avgLat = group.reduce((sum, p) => sum + p.lat, 0) / group.length;
          const avgLng = group.reduce((sum, p) => sum + p.lng, 0) / group.length;
